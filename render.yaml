services:
  - type: web
    name: yeelight-remote
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: python -m server
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.3
      - key: ACCESS_KEY
        sync: false
      - key: HOST
        value: 0.0.0.0
      - key: DB_PATH
        value: /tmp/server.db
